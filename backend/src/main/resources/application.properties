spring.application.name=telecom-dashboard

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/telecom_dashboard}
spring.datasource.username=${DB_USERNAME:telecom_user}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

server.port=${PORT:8080}
